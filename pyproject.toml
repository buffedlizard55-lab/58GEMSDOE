[project]
name = "gems58"
version = "58.0.0"
description = "Ribbon lane: emission width matched to the measured localisation error (DOE GEMS Prize)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "rasterio>=1.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
