name: Refresh status feed
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Refresh the feed from the receipts
        run: PYTHONPATH=src python scripts/refresh_feed.py --check-sources
      - name: Site QA must still pass
        run: PYTHONPATH=src python scripts/check_site.py
      - name: Commit if it changed
        run: |
          git config user.name  "gems58-feed"
          git config user.email "gems58-feed@users.noreply.github.com"
          git add docs/data/feed.json docs/data/source_health.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "feed: refresh $(date -u +%FT%TZ)"
          git push || true
