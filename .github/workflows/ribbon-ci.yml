name: Ribbon lane CI
on:
  push:
    paths: ["src/**", "scripts/**", "tests/**", "evidence/**", "registry/**", "docs/**",
            "pyproject.toml", "requirements.txt", ".github/workflows/ribbon-ci.yml"]
  pull_request:
    paths: ["src/**", "scripts/**", "tests/**", "evidence/**", "registry/**", "docs/**"]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Metric theorems (no feature stack needed)
        run: PYTHONPATH=src python scripts/ribbon_verify_theorems.py
      - name: Ribbon-lane tests
        run: PYTHONPATH=src:. python -m pytest tests/test_ribbon_*.py -q
      - name: Uniqueness instrument tests (corrected directions, chance correction, saturation)
        run: PYTHONPATH=src:. python -m pytest tests/test_uniqueness_informative.py -q
      - name: Site gate tests (the banner can only turn green on complete evidence)
        run: PYTHONPATH=src:. python -m pytest tests/test_build_site.py -q
      - name: Lane subsite renders from the receipts
        run: PYTHONPATH=src python scripts/ribbon_build_site.py
      - name: Lane subsite QA
        run: PYTHONPATH=src python scripts/ribbon_check_site.py
      - name: Main site renders from the receipts, and the banner matches the evidence
        run: |
          set +e
          PYTHONPATH=src python scripts/build_site.py
          code=$?
          set -e
          echo "build_site.py exit code: $code"
          # 0 = every gate G1-G5 passed (banner green); 2 = at least one gate is open (banner red).
          # Anything else is a real failure.
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit 1; fi
          if [ "$code" -eq 0 ]; then
            grep -q "OK TO DOWNLOAD AND SUBMIT" docs/index.html
            grep -q "OK TO DOWNLOAD AND SUBMIT" docs/executive-summary.html
          else
            grep -q "NOT OK TO SUBMIT" docs/index.html
            grep -q "NOT OK TO SUBMIT" docs/executive-summary.html
          fi
          # the download button, the sha256 and the submission note must be on the first screen
          grep -q "big-btn" docs/index.html
          grep -q "ecf833f8ea7a6698636b48b0dcd0d03aa925d603753e60e03d9d1660922711dd" docs/index.html
          grep -q "15/15" docs/submit.html || grep -q "PASS" docs/submit.html
