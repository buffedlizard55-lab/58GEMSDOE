name: Ribbon lane CI
on:
  push:
    paths: ["src/gems58w/**", "scripts/ribbon_*", "tests/test_ribbon_*", "evidence/ribbon/**",
            "registry/ribbon/**", "docs/ribbon/**", "pyproject.toml", "requirements.txt",
            ".github/workflows/ribbon-ci.yml"]
  pull_request:
    paths: ["src/gems58w/**", "scripts/ribbon_*", "tests/test_ribbon_*", "evidence/ribbon/**",
            "registry/ribbon/**", "docs/ribbon/**"]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Metric theorems (no feature stack needed)
        run: PYTHONPATH=src python scripts/ribbon_verify_theorems.py
      - name: Ribbon-lane tests
        run: PYTHONPATH=src:. python -m pytest tests/test_ribbon_*.py -q
      - name: Site renders from the receipts
        run: PYTHONPATH=src python scripts/ribbon_build_site.py
      - name: Site QA
        run: PYTHONPATH=src python scripts/ribbon_check_site.py
