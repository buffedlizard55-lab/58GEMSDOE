name: Fail-closed repository checks
on:
  push:
    paths:
      - "src/gems57/**"
      - "src/gems58w/**"
      - "scripts/build_site.py"
      - "scripts/ribbon_check_site.py"
      - "tests/**"
      - "docs/**"
      - "evidence/run_card.json"
      - "evidence/ribbon_uniqueness.json"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/ribbon-ci.yml"
  pull_request:
    paths:
      - "src/gems57/**"
      - "src/gems58w/**"
      - "scripts/build_site.py"
      - "scripts/ribbon_check_site.py"
      - "tests/**"
      - "docs/**"
      - "evidence/run_card.json"
      - "evidence/ribbon_uniqueness.json"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/ribbon-ci.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -r requirements.txt
      - name: Run unit and repository-hygiene tests
        run: PYTHONPATH=src python -m pytest -q
      - name: Build current fail-closed status site
        run: python scripts/build_site.py
      - name: Check archived ribbon pages and current negative gates
        run: python scripts/ribbon_check_site.py
