name: Fail-closed repository checks
on:
  push:
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "evidence/**"
      - "registry/**"
      - "PROMPT.md"
      - "README.md"
      - "REMAINING_WORK.md"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/ribbon-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "evidence/**"
      - "registry/**"
      - "PROMPT.md"
      - "README.md"
      - "REMAINING_WORK.md"
      - "pyproject.toml"
      - "requirements.txt"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -r requirements.txt
      - name: Run unit and repository-hygiene tests
        run: PYTHONPATH=src python -m pytest -q
      - name: Re-render current session-7 status pages
        run: python scripts/build_session7_pages.py
      - name: Rebuild per-file download eligibility index
        run: python scripts/build_downloads_index.py
      - name: Confirm session-7 pages match the hash-bound run card
        run: python scripts/build_session7_pages.py --check
      - name: Check archived links and current fail-closed status
        run: python scripts/ribbon_check_site.py
