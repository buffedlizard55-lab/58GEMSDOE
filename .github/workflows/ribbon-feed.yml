name: Ribbon lane feed
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Refresh the lane feed from the receipts
        run: PYTHONPATH=src python scripts/ribbon_refresh_feed.py --check-sources
      - name: Site QA must still pass
        run: PYTHONPATH=src python scripts/ribbon_check_site.py
      - name: Commit if it changed
        run: |
          git config user.name  "gems58w-feed"
          git config user.email "gems58w-feed@users.noreply.github.com"
          git add docs/ribbon/data/feed.json || true
          git diff --cached --quiet || git commit -m "ribbon feed: refresh $(date -u +%FT%TZ)"
          git push || true
